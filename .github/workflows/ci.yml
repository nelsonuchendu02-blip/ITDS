name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: itds_ci
          POSTGRES_USER: itds_ci
          POSTGRES_PASSWORD: itds_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U itds_ci -d itds_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql+psycopg://itds_ci:itds_ci_password@localhost:5432/itds_ci
      TEST_DATABASE_URL: postgresql+psycopg://itds_ci:itds_ci_password@localhost:5432/itds_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Run SQLite fast tests
        run: pytest apps/api/tests -m "not postgresql"

      - name: Run PostgreSQL integration tests
        run: pytest apps/api/tests -m postgresql

      - name: Validate PostgreSQL migration lifecycle
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd apps/web
          npm install

      - name: Run frontend tests
        run: |
          cd apps/web
          npm test

      - name: Build frontend
        run: |
          cd apps/web
          npm run check
          npm run build
          npm audit

  windows-agent:
    runs-on: windows-latest
    needs: backend
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install agent dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r build\requirements-build.txt

      - name: Run agent test suite
        run: python -m pytest tests -q

      - name: Compile-check the agent package
        run: python -m compileall itds_agent installer build -q

      - name: pip check
        run: python -m pip check

      - name: Build ITDSAgent.exe and ITDSAgentEnroll.exe (PyInstaller)
        run: python build\build_exe.py

      - name: Verify packaged executables exist and start
        run: |
          if (!(Test-Path "build\dist\ITDSAgent\ITDSAgent.exe")) { throw "ITDSAgent.exe was not built" }
          if (!(Test-Path "build\dist\ITDSAgentEnroll\ITDSAgentEnroll.exe")) { throw "ITDSAgentEnroll.exe was not built" }
          $env:ITDS_AGENT_DATA_DIR = "$env:RUNNER_TEMP\itds-agent-ci"
          & "build\dist\ITDSAgentEnroll\ITDSAgentEnroll.exe" --clear
          if ($LASTEXITCODE -ne 0) { throw "ITDSAgentEnroll.exe --clear failed" }
          # win32serviceutil.HandleCommandLine exits non-zero for an
          # unrecognized command either way, so the exit code alone cannot
          # distinguish "reached usage output" from "crashed on import" -
          # check stderr for the frozen-import regression explicitly.
          $output = & "build\dist\ITDSAgent\ITDSAgent.exe" itds-ci-smoke-test 2>&1 | Out-String
          Write-Host $output
          if ($output -match "ImportError" -or $output -match "Traceback") {
            throw "ITDSAgent.exe failed to start (import/traceback detected)"
          }
          if ($output -notmatch "Unknown command" -and $output -notmatch "Usage:") {
            throw "ITDSAgent.exe did not reach the expected usage output"
          }
